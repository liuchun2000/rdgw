name: Release

on:
  push:
    tags:
      - v*

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create release on Github
        env:
          GH_TOKEN:  ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh --repo "$REPO" release view "$RELEASE_TAG" --json id >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists, skipping create"
            exit 0
          fi
          if [[ "$RELEASE_TAG" == *-rc* ]]; then
            gh --repo "$REPO" release create "$RELEASE_TAG" --verify-tag --generate-notes --prerelease
          else
            gh --repo "$REPO" release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
